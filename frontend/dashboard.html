<script>
    // Todas las llamadas pasan por el mismo dominio, lo que permite desplegar
    // el frontend y las API detrás de Nginx sin exponer puertos internos.
    const fetchOriginal = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
        const destino = String(input);
        const tokenActual = localStorage.getItem('token');
        const headers = { ...(init.headers || {}) };
        if (destino.startsWith('/api/') && tokenActual) {
            headers.Authorization = `Bearer ${tokenActual}`;
        }
        return fetchOriginal(input, { ...init, headers });
    };
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario'));

    if (!token || !usuario) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('bienvenida').innerText = `¡Hola, ${usuario.nombre}! 👋`;
        document.getElementById('badge').innerText = `ROL: ${usuario.rol.toUpperCase()}`;
        
        // Asignar fecha actual al input date
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha_emision').value = hoy;
        
        cargarTodo();
    }

    // Navegación entre las vistas
    function verPantalla(id, btn) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`pantalla-${id}`).classList.add('activa');
        btn.classList.add('active');
    }

    async function cargarTodo() {
        cargarDashboard();
        cargarProductos();
        cargarCategorias();
        cargarProveedores();
        cargarOrdenes();
    }

    // 1. Dashboard Stock (ms-inventario :3003) con Multi-Endpoint Fallback
    async function cargarDashboard() {
        const tabla = document.getElementById('tablaAlertas');
        const rutasInventario = [
            '/api/inventario/inventario',
            '/api/inventario/inventarios',
            '/api/inventario/stock',
            '/api/inventario/alertas'
        ];

        let items = null;

        for (const url of rutasInventario) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    items = await res.json();
                    break;
                }
            } catch (e) {
                // Intentar con la siguiente ruta
            }
        }

        if (items && Array.isArray(items)) {
            if (items.length === 0) {
                tabla.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay registros de inventario.</td></tr>';
                return;
            }
            tabla.innerHTML = items.map(i => {
                const stockAct = i.stock_actual ?? i.cantidad ?? i.stock ?? 0;
                const stockMin = i.stock_minimo ?? i.minimo ?? 5;
                const esBajo = stockAct <= stockMin;

                return `
                    <tr>
                        <td>#${i.producto_id || i.id}</td>
                        <td><strong>${stockAct}</strong></td>
                        <td>${stockMin}</td>
                        <td>
                            <span style="color:${esBajo ? '#f38ba8' : '#a6e3a1'}; font-weight: bold;">
                                ${esBajo ? '⚠️ Bajo Stock' : '✅ Stock Normal'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        } else {
            tabla.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#a6adc8;">No se pudo conectar con ms-inventario (:3003). Revisa que el servicio esté corriendo.</td></tr>';
        }
    }

    // 2. Productos (ms-productos :3002)
    async function cargarProductos() {
        const tabla = document.getElementById('tablaProductos');
        try {
            const res = await fetch('/api/productos/productos');
            if (res.ok) {
                const prods = await res.json();
                if (prods.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay productos registrados.</td></tr>';
                    return;
                }
                tabla.innerHTML = prods.map(p => `
                    <tr>
                        <td>#${p.id}</td>
                        <td><strong>${p.nombre}</strong></td>
                        <td>$${parseFloat(p.precio || 0).toFixed(2)}</td>
                        <td>#${p.categoria_id || 'N/A'}</td>
                    </tr>
                `).join('');
            } else {
                throw new Error();
            }
        } catch(e) {
            tabla.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#a6adc8;">Servicio ms-productos (:3002) no disponible.</td></tr>';
        }
    }

    // 3. Categorías (ms-productos :3002)
    async function cargarCategorias() {
        const tabla = document.getElementById('tablaCategorias');
        try {
            const res = await fetch('/api/productos/categorias');
            if (res.ok) {
                const cats = await res.json();
                if (cats.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="2" style="text-align:center;">No hay categorías registradas.</td></tr>';
                    return;
                }
                tabla.innerHTML = cats.map(c => `
                    <tr>
                        <td>#${c.id}</td>
                        <td><strong>${c.nombre || c.nombre_categoria}</strong></td>
                    </tr>
                `).join('');
            } else {
                throw new Error();
            }
        } catch(e) {
            tabla.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#a6adc8;">Servicio ms-productos (:3002) no disponible.</td></tr>';
        }
    }

    // 4. Proveedores (ms-proveedores :3005)
    async function cargarProveedores() {
        const tabla = document.getElementById('tablaProveedores');
        try {
            const res = await fetch('/api/proveedores/proveedores');
            if (res.ok) {
                const provs = await res.json();
                if (provs.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="3" style="text-align:center;">No hay proveedores registrados.</td></tr>';
                    return;
                }
                tabla.innerHTML = provs.map(p => `
                    <tr>
                        <td>#${p.id}</td>
                        <td><strong>${p.nombre_empresa || p.nombre}</strong></td>
                        <td>${p.telefono || p.contacto || 'N/A'}</td>
                    </tr>
                `).join('');
            } else {
                throw new Error();
            }
        } catch(e) {
            tabla.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#a6adc8;">Servicio ms-proveedores (:3005) no disponible.</td></tr>';
        }
    }

    // 5. Órdenes (ms-ordenes :3007)
    async function cargarOrdenes() {
        const tabla = document.getElementById('tablaOrdenes');
        try {
            const [resOrdenes, resProvs] = await Promise.all([
                fetch('/api/ordenes/ordenes'),
                fetch('/api/proveedores/proveedores').catch(() => null)
            ]);

            if (!resOrdenes.ok) throw new Error('Error al consultar órdenes');
            
            const ordenes = await resOrdenes.json();
            let mapaProveedores = {};

            if (resProvs && resProvs.ok) {
                const proveedores = await resProvs.json();
                proveedores.forEach(p => {
                    mapaProveedores[p.id] = p.nombre_empresa || p.nombre || `Proveedor #${p.id}`;
                });
            }
            
            if (ordenes.length === 0) {
                tabla.innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay órdenes registradas.</td></tr>';
                return;
            }

            tabla.innerHTML = ordenes.map(o => {
                const fecha = o.fecha_emision 
                    ? new Date(o.fecha_emision).toLocaleDateString() 
                    : 'Sin fecha';
                const idLimpio = o.proveedor_id ? Math.abs(o.proveedor_id) : 'N/A';
                const nombreProveedor = mapaProveedores[o.proveedor_id] || `Proveedor #${idLimpio}`;

                return `
                    <tr>
                        <td>#${o.id}</td>
                        <td><strong>${nombreProveedor}</strong></td>
                        <td>$${parseFloat(o.total || 0).toFixed(2)}</td>
                        <td>${fecha}</td>
                    </tr>
                `;
            }).join('');

        } catch (err) {
            tabla.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #f38ba8;">Servicio ms-ordenes (:3007) no disponible.</td></tr>`;
        }
    }

    // Evento Crear Orden
    document.getElementById('formOrden').addEventListener('submit', async (e) => {
        e.preventDefault();
        const mensajeDiv = document.getElementById('mensajeForm');
        mensajeDiv.style.display = 'none';

        const payload = {
            proveedor_id: parseInt(document.getElementById('proveedor_id').value),
            producto_id: parseInt(document.getElementById('producto_id').value),
            monto_total: parseFloat(document.getElementById('total').value),
            fecha_emision: document.getElementById('fecha_emision').value
        };

        try {
            const res = await fetch('/api/ordenes/ordenes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                mensajeDiv.className = 'mensaje exito';
                mensajeDiv.innerText = '✅ Orden creada exitosamente (Validado con ms-inventario)';
                mensajeDiv.style.display = 'block';
                
                document.getElementById('proveedor_id').value = '';
                document.getElementById('producto_id').value = '';
                document.getElementById('total').value = '';
                cargarOrdenes();
                cargarDashboard();
            } else {
                throw new Error(data.error || 'Error al crear la orden');
            }
        } catch (err) {
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.innerText = `❌ ${err.message}`;
            mensajeDiv.style.display = 'block';
        }
    });

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
