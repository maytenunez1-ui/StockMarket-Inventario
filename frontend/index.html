<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMarket - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #181825;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #89b4fa; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #313244;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background-color: #b4befe; }
        .mensaje { margin-top: 1rem; text-align: center; font-size: 0.85rem; }
        .exito { color: #a6e3a1; }
        .error { color: #f38ba8; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>StockMarket 🛒</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required value="admin@stockmarket.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required value="1234">
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
